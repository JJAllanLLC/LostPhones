name: Staging paid-download E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stripe-checkout:
    if: github.ref == 'refs/heads/v2-development'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise Stripe test checkout and paid PDF delivery
        run: npm run test:e2e:staging
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          LOSTPHONES_E2E_EMAIL: ${{ secrets.LOSTPHONES_E2E_EMAIL }}
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-paid-download-e2e-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
